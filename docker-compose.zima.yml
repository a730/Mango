# ZIMA OS compatible docker-compose
# Copy this file to your app directory and adjust paths as needed.
# Uses pinned image tags so you can roll back if an update breaks something.
# Change the version tag (e.g. 0.27.0) to any released version.

services:
  mango:
    container_name: mango
    image: ghcr.io/a730/mango:0.27.0
    ports:
      - "9000:9000"
    volumes:
      - ./data/mango:/home/mango/mango
      - ./data/config:/home/mango/.config/mango
    environment:
      - PORT=9000
    depends_on:
      - anime-middleware
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - NET_BIND_SERVICE
      - FOWNER
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "1.0"
    restart: unless-stopped
    networks:
      - mango-net

  anime-middleware:
    container_name: anime-middleware
    image: ghcr.io/a730/mango-anime-middleware:0.27.0
    expose:
      - "3456"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    restart: unless-stopped
    networks:
      - mango-net

networks:
  mango-net:
    driver: bridge
