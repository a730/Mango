name: Build

on:
  push:
    branches: [ master, dev, hotfix/* ]
  pull_request:
    branches: [ master, dev ]

jobs:
  build:
    if: "!contains(github.event.head_commit.message, 'skip ci')"

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install Crystal
      uses: crystal-lang/install-crystal@v1
      with:
        crystal: 1.16.3
    - name: Install system deps
      run: sudo apt-get update && sudo apt-get install -y libssl-dev libxml2-dev libyaml-dev libreadline-dev libpcre2-dev libsqlite3-dev libarchive-dev libjpeg-dev libpng-dev libtiff-dev
    - name: Pre-install patched image_size shard
      run: |
        git clone --depth=1 https://github.com/hkalexling/image_size.cr.git lib/image_size
        cd lib/image_size/ext/stbi
        curl -sL -o stb_image_resize.h \
          "https://raw.githubusercontent.com/nothings/stb/af1a5bc352164740c1cc1354942b1c6b72eacb8a/stb_image_resize.h"
        cd ../..
        make 2>&1 | tail -5
        cd /workspaces/Mango
    - name: Install remaining shards
      run: shards install
    - name: Install shards
      run: shards install
    - name: Build
      run: crystal build src/mango.cr --release --progress
    - name: Run tests
      run: crystal spec
    - name: Upload binary
      uses: actions/upload-artifact@v4
      with:
        name: mango
        path: mango
