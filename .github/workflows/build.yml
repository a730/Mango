name: Build

on:
  push:
    branches: [ master, dev, hotfix/* ]
  pull_request:
    branches: [ master, dev ]

jobs:
  build:
    if: "!contains(github.event.head_commit.message, 'skip ci')"

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install Crystal
      uses: crystal-lang/install-crystal@v1
      with:
        crystal: 1.16.3
    - name: Install system deps
      run: sudo apt-get update && sudo apt-get install -y libssl-dev libxml2-dev libyaml-dev libreadline-dev libpcre2-dev libsqlite3-dev libarchive-dev libjpeg-dev libpng-dev libtiff-dev
    - name: Build vendored image_size native extensions
      run: cd lib/image_size && make 2>&1 | tail -5
    - name: Install shards
      run: shards install
    - name: Build
      run: crystal build src/mango.cr --release --progress
    - name: Upload binary
      uses: actions/upload-artifact@v4
      with:
        name: mango
        path: mango
