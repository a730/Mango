name: Docker

on:
  push:
    branches: [master]
    paths-ignore:
      - "README.md"
      - "**.md"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  MANGO_IMAGE: ghcr.io/${{ github.repository_owner }}/mango
  MIDDLEWARE_IMAGE: ghcr.io/${{ github.repository_owner }}/mango-anime-middleware

jobs:
  build-mango:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: 1.16.3

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libxml2-dev libyaml-dev libreadline-dev \
            libpcre2-dev libsqlite3-dev libarchive-dev libjpeg-dev libpng-dev libtiff-dev

      - name: Install shards (first pass, image_size postinstall will fail)
        run: shards install || true

      - name: Fix image_size native build (stb_image_resize.h removed from upstream)
        run: |
          sed -i 's|nothings/stb/master/stb_image_resize.h|nothings/stb/af1a5bc352164740c1cc1354942b1c6b72eacb8a/stb_image_resize.h|g' \
            lib/image_size/ext/stbi/Makefile
          cd lib/image_size && make 2>&1 | tail -5

      - name: Install shards (second pass, image_size now succeeds)
        run: shards install

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        run: npm install

      - name: Build Mango binary
        run: crystal build src/mango.cr --release --progress

      - name: Build Mango binary
        run: crystal build src/mango.cr --release --progress

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: mango-binary
          path: mango
          retention-days: 1

  build-middleware:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.MIDDLEWARE_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,suffix=,format=short

      - name: Build and push middleware
        uses: docker/build-push-action@v6
        with:
          context: ./anime-middleware
          file: ./anime-middleware/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  package:
    needs: [build-mango]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: mango-binary
          path: ./dist

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.MANGO_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,suffix=,format=short

      - name: Build and push Mango image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.release
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
